<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion & Demande d'accès - ZBM</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #1e293b; }
    .login-card { background-color: #ffffff; padding: 30px; border-radius: 8px; width: 360px; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.15); border-top: 5px solid #dc2626; }
    .login-card h2 { margin-top: 0; color: #dc2626; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #475569; font-weight: bold; }
    .form-group input, .form-group select { width: 93%; padding: 9px; border-radius: 4px; border: 1px solid #cbd5e1; background-color: #ffffff; color: #0f172a; }
    .btn-login { width: 100%; padding: 10px; background-color: #dc2626; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
    .btn-login:hover { background-color: #b91c1c; }
    .btn-register { width: 100%; padding: 10px; background-color: #ffffff; border: 1px solid #dc2626; border-radius: 4px; color: #dc2626; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-register:hover { background-color: #fef2f2; }
    .alert-msg { padding: 10px; border-radius: 4px; font-size: 13px; margin-top: 15px; text-align: center; display: none; }
    .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .alert-warning { background-color: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .alert-success { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #ffffff; padding: 25px; border-radius: 8px; width: 400px; max-height: 85vh; overflow-y: auto; border-top: 5px solid #dc2626; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Connexion ZBM</h2>
    <form id="form-login">
      <div class="form-group">
        <label>Adresse Mail</label>
        <input type="email" id="email" required placeholder="nom@zbm.com">
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login">Se connecter</button>
      <button type="button" class="btn-register" onclick="ouvrirModal()">Créer un compte (Demander accès)</button>
      <div id="msg-box" class="alert-msg"></div>
    </form>
  </div>

  <div class="modal" id="modal-register">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#dc2626;">Demande d'accès / Inscription</h3>
      <form id="form-register">
        <div class="form-group">
          <label>Type de Compte</label>
          <select id="reg-role" required>
            <option value="ZBM">Directeur ZBM</option>
            <option value="DC">Directeur de Centre (DC)</option>
            <option value="SD">Agent de Terrain (SD)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Nom Complet</label>
          <input type="text" id="reg-nom" required placeholder="Nom Prénom">
        </div>
        <div class="form-group">
          <label>Adresse Mail</label>
          <input type="email" id="reg-email" required placeholder="nom@zbm.com">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Zone / Territoire (Ex: NORD KIVU 1, Birere1)</label>
          <input type="text" id="reg-zone" required placeholder="Ex: NORD KIVU 1">
        </div>
        <div class="form-group">
          <label>Nombre de Sites</label>
          <input type="number" id="reg-nb-sites" required placeholder="Ex: 5" min="1">
        </div>
        <div class="form-group">
          <label>ID Site principal</label>
          <input type="text" id="reg-id-site" required placeholder="Ex: SITE-001">
        </div>

        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="button" class="btn-register" onclick="fermerModal()">Annuler</button>
          <button type="submit" class="btn-login">Envoyer la demande</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function ouvrirModal() { document.getElementById('modal-register').style.display = 'flex'; }
    function fermerModal() { document.getElementById('modal-register').style.display = 'none'; }

    document.getElementById('form-login').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      const msgBox = document.getElementById('msg-box');
      msgBox.style.display = 'none';

      if (email === "admin@zbm.com" && password === "admin123") {
        localStorage.setItem('compte_connecte', JSON.stringify({ role: "ADMIN", nom: "Super Admin", email: email }));
        window.location.href = "index.html";
        return;
      }

      const zbms = JSON.parse(localStorage.getItem('comptes_zbm_zbm')) || [];
      const zbmTrouve = zbms.find(z => z.email && z.email.toLowerCase() === email && z.password === password);
      if (zbmTrouve) {
        if (zbmTrouve.statut !== "ACTIF") {
          msgBox.className = "alert-msg alert-warning";
          msgBox.innerText = "Compte en attente de validation par l'Admin.";
          msgBox.style.display = "block";
          return;
        }
        localStorage.setItem('compte_connecte', JSON.stringify({ role: "ZBM", code: zbmTrouve.code, nom: zbmTrouve.nom, email: email, zone: zbmTrouve.zone }));
        window.location.href = "zbm_global.html";
        return;
      }

      const dcs = JSON.parse(localStorage.getItem('comptes_dc_zbm')) || [];
      const dcTrouve = dcs.find(d => d.email && d.email.toLowerCase() === email && d.password === password);
      if (dcTrouve) {
        if (dcTrouve.statut !== "ACTIF") {
          msgBox.className = "alert-msg alert-warning";
          msgBox.innerText = "Compte en attente de validation par l'Admin.";
          msgBox.style.display = "block";
          return;
        }
        localStorage.setItem('compte_connecte', JSON.stringify({ role: "DC", code: dcTrouve.code, nom: dcTrouve.nom, email: email, zone: dcTrouve.zone }));
        window.location.href = "reports.html";
        return;
      }

      const sds = JSON.parse(localStorage.getItem('comptes_sd_zbm')) || [];
      const sdTrouve = sds.find(s => s.email && s.email.toLowerCase() === email && s.password === password);
      if (sdTrouve) {
        if (sdTrouve.statut !== "ACTIF") {
          msgBox.className = "alert-msg alert-warning";
          msgBox.innerText = "Compte en attente de validation par l'Admin.";
          msgBox.style.display = "block";
          return;
        }
        localStorage.setItem('compte_connecte', JSON.stringify({ role: "SD", code: sdTrouve.code, nom: sdTrouve.nom, email: email, zone: sdTrouve.zone }));
        window.location.href = "sd_saisie.html";
        return;
      }

      msgBox.className = "alert-msg alert-error";
      msgBox.innerText = "Adresse e-mail ou mot de passe incorrect.";
      msgBox.style.display = "block";
    });

    document.getElementById('form-register').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('reg-role').value;
      const nom = document.getElementById('reg-nom').value;
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value.trim();
      const zone = document.getElementById('reg-zone').value.trim();
      const nbSites = document.getElementById('reg-nb-sites').value;
      const idSite = document.getElementById('reg-id-site').value;

      const nouveauCompte = {
        code: role + "-" + Math.floor(10000 + Math.random() * 90000),
        nom, email, password, zone, nbSites, idSite, statut: "EN_ATTENTE"
      };

      if (role === "ZBM") {
        const zbms = JSON.parse(localStorage.getItem('comptes_zbm_zbm')) || [];
        zbms.push(nouveauCompte);
        localStorage.setItem('comptes_zbm_zbm', JSON.stringify(zbms));
      } else if (role === "DC") {
        const dcs = JSON.parse(localStorage.getItem('comptes_dc_zbm')) || [];
        dcs.push(nouveauCompte);
        localStorage.setItem('comptes_dc_zbm', JSON.stringify(dcs));
      } else {
        const sds = JSON.parse(localStorage.getItem('comptes_sd_zbm')) || [];
        sds.push(nouveauCompte);
        localStorage.setItem('comptes_sd_zbm', JSON.stringify(sds));
      }

      fermerModal();
      const msgBox = document.getElementById('msg-box');
      msgBox.className = "alert-msg alert-success";
      msgBox.innerText = "Demande d'accès envoyée ! En attente d'approbation.";
      msgBox.style.display = "block";
    });
  </script>
</body>
</html>
